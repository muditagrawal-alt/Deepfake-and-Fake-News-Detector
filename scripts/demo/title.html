<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&family=Geist:wght@400;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:720px; background:#131110; color:#f3f1ee;
         font-family:Geist, system-ui, sans-serif; display:flex; align-items:center; }
  .wrap { padding-left:96px; }
  h1 { font-family:'Geist Mono', monospace; font-size:118px; font-weight:600;
       letter-spacing:-0.03em; line-height:.95; }
  .rule { height:1px; background:#3d3935; margin:26px 0 22px; width:0; animation:grow .9s cubic-bezier(.16,1,.3,1) .5s forwards; }
  p.sub { font-size:25px; color:#c9c4bd; opacity:0; animation:fade .7s ease .9s forwards; }
  p.by { margin-top:44px; font-size:19px; color:#85807a; opacity:0; animation:fade .7s ease 1.25s forwards; }
  p.by strong { color:#f3f1ee; font-weight:600; }
  @keyframes grow { to { width:660px; } }
  @keyframes fade { to { opacity:1; } }
</style></head><body><div class="wrap">
  <h1>VERITAS</h1>
  <div class="rule"></div>
  <p class="sub">Deepfake and fake news detection</p>
  <p class="by">A major project by <strong>Mudit Agrawal</strong></p>
</div></body></html>
